<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #cfcfcf; }
    .key { fill: #111111; }
    .panel { fill: #f4f4f4; stroke: #e0e0e0; }
    .n { font-size: 10px; font-weight: 600; fill: #8a8a8a; }
    .nw { font-size: 10px; font-weight: 600; fill: #9a9a9a; }
    .t { font-size: 13px; font-weight: 600; fill: #111; }
    .tw { font-size: 13px; font-weight: 600; fill: #fff; }
    .s { font-size: 10.5px; fill: #5c5c5c; }
    .sw { font-size: 10.5px; fill: #d0d0d0; }
    .h { font-size: 13px; font-weight: 600; fill: #111; }
    .li { font-size: 11px; fill: #222; }
    .x { font-size: 11px; font-weight: 600; fill: #a8231a; }
    .ok { font-size: 11px; font-weight: 600; fill: #1e6b41; }
    .arrow { stroke: #111; stroke-width: 1.3; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect width="980" height="400" fill="#fff"/>
  <text class="h" x="20" y="28">Every payment request passes every layer, in this order</text>

  <!-- 7 stages: w=126, gap 10, start 19 -->
  <rect class="box" x="19" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="33" y="66">1</text>
  <text class="t" x="33" y="84">Sign-in</text>
  <text class="s" x="33" y="104">bcrypt passwords</text>
  <text class="s" x="33" y="119">JWT valid 2 h</text>
  <text class="s" x="33" y="134">every query scoped</text>
  <text class="s" x="33" y="149">to the student</text>

  <rect class="box" x="155" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="169" y="66">2</text>
  <text class="t" x="169" y="84">Payee check</text>
  <text class="s" x="169" y="104">verified university</text>
  <text class="s" x="169" y="119">registry</text>
  <text class="s" x="169" y="134">look-alike accounts</text>
  <text class="s" x="169" y="149">flagged</text>

  <rect class="box" x="291" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="305" y="66">3</text>
  <text class="t" x="305" y="84">Fraud model</text>
  <text class="s" x="305" y="104">20 behaviour</text>
  <text class="s" x="305" y="119">features</text>
  <text class="s" x="305" y="134">6 models stacked</text>
  <text class="s" x="305" y="149">reasons explained</text>

  <rect class="box" x="427" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="441" y="66">4</text>
  <text class="t" x="441" y="84">Policy</text>
  <text class="s" x="441" y="104">blocks high risk,</text>
  <text class="s" x="441" y="119">money mules, fake</text>
  <text class="s" x="441" y="134">tuition, crypto to</text>
  <text class="s" x="441" y="149">strangers</text>

  <rect class="key" x="563" y="44" width="126" height="138" rx="16"/>
  <text class="nw" x="577" y="66">5</text>
  <text class="tw" x="577" y="84">Fingerprint</text>
  <text class="sw" x="577" y="104">Keystore key signs</text>
  <text class="sw" x="577" y="119">a one-time challenge</text>
  <text class="sw" x="577" y="134">expires in 15 min</text>
  <text class="sw" x="577" y="149">no replay</text>

  <rect class="box" x="699" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="713" y="66">6</text>
  <text class="t" x="713" y="84">Settlement</text>
  <text class="s" x="713" y="104">balance re-checked</text>
  <text class="s" x="713" y="119">receipt with an</text>
  <text class="s" x="713" y="134">HMAC code anyone</text>
  <text class="s" x="713" y="149">can check</text>

  <rect class="box" x="835" y="44" width="126" height="138" rx="16"/>
  <text class="n" x="849" y="66">7</text>
  <text class="t" x="849" y="84">Audit</text>
  <text class="s" x="849" y="104">SHA-256 hash chain</text>
  <text class="s" x="849" y="119">head anchored daily</text>
  <text class="s" x="849" y="134">on Ethereum Sepolia</text>
  <text class="s" x="849" y="149">any rewrite is caught</text>

  <path class="arrow" d="M145,113 L154,113"/>
  <path class="arrow" d="M281,113 L290,113"/>
  <path class="arrow" d="M417,113 L426,113"/>
  <path class="arrow" d="M553,113 L562,113"/>
  <path class="arrow" d="M689,113 L698,113"/>
  <path class="arrow" d="M825,113 L834,113"/>

  <!-- Panels -->
  <rect class="panel" x="19" y="206" width="466" height="176" rx="18"/>
  <text class="h" x="39" y="234">What the AI agent cannot do</text>
  <text class="x" x="39" y="262">✕</text><text class="li" x="58" y="262">Approve a payment: only the student's phone key can sign.</text>
  <text class="x" x="39" y="288">✕</text><text class="li" x="58" y="288">Lower a risk tier: the policy never reads the model's text.</text>
  <text class="x" x="39" y="314">✕</text><text class="li" x="58" y="314">Skip a check: it uses the same pipeline as the app's screens.</text>
  <text class="x" x="39" y="340">✕</text><text class="li" x="58" y="340">Obey a pasted message: it is treated as data, checked by rules.</text>
  <text class="x" x="39" y="366">✕</text><text class="li" x="58" y="366">Clear a scam warning: the AI second opinion can only raise it.</text>

  <rect class="panel" x="495" y="206" width="466" height="176" rx="18"/>
  <text class="h" x="515" y="234">How the student's data is protected</text>
  <text class="ok" x="515" y="262">✓</text><text class="li" x="534" y="262">Private key stays in the phone's secure hardware.</text>
  <text class="ok" x="515" y="288">✓</text><text class="li" x="534" y="288">Screenshots are read on the phone, never uploaded.</text>
  <text class="ok" x="515" y="314">✓</text><text class="li" x="534" y="314">Account numbers shown as the last 4 digits only.</text>
  <text class="ok" x="515" y="340">✓</text><text class="li" x="534" y="340">Login token in Android encrypted storage; no secrets in the app.</text>
  <text class="ok" x="515" y="366">✓</text><text class="li" x="534" y="366">Gemini and push are optional and off unless configured.</text>
</svg>
